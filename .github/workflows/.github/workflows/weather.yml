name: 抓取杭州天气

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 抓取并写入 hangzhou.json
        run: node fetch.mjs
      - name: 有变化才提交
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain hangzhou.json)" ]; then
            git add hangzhou.json
            git commit -m "天气更新 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          else
            echo "数据无变化，跳过提交"
          fi
